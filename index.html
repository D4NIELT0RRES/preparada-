<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Mensagem Especial para Você</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/suspense.css">
</head>
<body>
    <div class="suspense-container">
        <h1 class="suspense-mensagem">Uma grande aventura está prestes a começar...</h1>
        <div class="loader"></div>
    </div>

    <div class="envelope-container oculto">
        <div class="envelope">
            <div class="tampa">
                <div class="coracao-tampa"></div>
            </div>
            <div class="carta">
                <h2 class="destinatario">Minha Rafinha,</h2>
                <p id="mensagem"></p>
                <p class="assinatura">Com todo o meu amor,<br>Victor Torres</p>
            </div>
            <div class="flores-esquerda"></div>
            <div class="flores-direita"></div>
        </div>
        <div class="mensagem-inicial">Clique no envelope para abrir sua surpresa!</div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/suspense.js"></script>
</body>
</html>
